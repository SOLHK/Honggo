name: Integrate iOS 27.2 beta
on:
  push:
    branches: [work/ios27-tg-r7]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed feature changes and exact-runtime test selection
        run: |
          set -euo pipefail
          test -f .github/r7-feature.patch
          echo 'eadbe14975ef01999d646aa172d8a95087e7b046a794ec1f7b069cbc2e2259d3  .github/r7-feature.patch' | sha256sum -c -
          git apply --check .github/r7-feature.patch
          git apply --index .github/r7-feature.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path('tools').glob('test-*ios.sh'))
          assert len(files) == 6
          for path in files:
              text = path.read_text()
              pattern = r'''selection=\$\(python3 - "\$work/simulators\.json" <<'PY'\n.*?\nPY\n\)'''
              replacement = 'selection=$(python3 "$source_root/tools/simulator_target.py" "$work/simulators.json" --record "$work/simulator-target.json")'
              text, count = re.subn(pattern, lambda match: replacement, text, flags=re.S)
              assert count == 1, path
              marker = 'xcrun simctl bootstatus "$device_id" -b\n'
              assert marker in text
              text = text.replace(marker, marker + 'python3 "$source_root/tools/simulator_target.py" "$work/simulators.json" --record "$work/simulator-target.json" --verify-booted "$device_id"\n', 1)
              if path.name == 'test-settings-ios.sh':
                  text = text.replace('settings-options-simulator.png settings-search-failure-simulator.png', 'settings-options-simulator.png settings-community-simulator.png settings-search-failure-simulator.png')
              path.write_text(text)
          PY
          git add tools/test-*ios.sh
          git rm .github/r7-feature.patch
          python3 -B -m unittest discover -s tests -v
          for script in tools/*.sh; do bash -n "$script"; done
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add TG channel, search regressions and strict iOS 27.2 simulator selection'
          git push origin HEAD:refs/heads/work/ios27-tg-r7
          git rev-parse HEAD
