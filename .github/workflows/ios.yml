name: Build iOS plugin

on:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  tabbar:
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify plugin version
        id: version
        env:
          VERSION_BASE: ${{ github.event.before }}
        run: |
          version=$(python3 tools/version.py --check --base "$VERSION_BASE")
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check IPA preparation and version rules
        run: python3 -B -m unittest discover -s tests -v
      - name: Check glass tab bar in UIKit with a simulated host
        run: bash tools/test-tabbar-ios.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: Honggo-tabbar-simulator-evidence
          path: |
            build/tabbar-tests/**/*-results.json
            build/tabbar-tests/**/*-simulator.png
            build/tabbar-tests/**/simulator.log
          if-no-files-found: warn

  settings:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check settings in UIKit with a simulated host
        run: bash tools/test-settings-ios.sh
      - name: Check bounded diagnostics on real Foundation
        run: bash tools/test-diagnostics.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: Honggo-settings-simulator-evidence
          path: |
            build/settings-tests/settings-results.json
            build/settings-tests/simulator.log
            build/settings-tests/*-simulator.png
            build/diagnostics-tests/*.log
          if-no-files-found: warn

  iphoneos:
    # Do not build or publish a device candidate unless both UIKit suites pass.
    needs: [tabbar, settings]
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inspect device dylib
        env:
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          bash tools/build-ios.sh
          git rev-parse HEAD > build/source-commit.txt
          printf '%s\n' "$PLUGIN_VERSION" > build/VERSION
          (cd build && shasum -a 256 "Honggo-$PLUGIN_VERSION.dylib" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Honggo-${{ needs.tabbar.outputs.version }}
          path: |
            build/Honggo-${{ needs.tabbar.outputs.version }}.dylib
            build/VERSION
            build/source-commit.txt
            build/SHA256SUMS.txt
          if-no-files-found: error

  publish_test:
    name: Publish verified test dylib
    if: github.ref == 'refs/heads/test'
    needs: [tabbar, settings, iphoneos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download dylib built by this successful run
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "Honggo-${PLUGIN_VERSION}" --dir release
      - name: Verify downloaded artifact identity and checksum
        env:
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          set -euo pipefail
          test "$(cat release/VERSION)" = "$PLUGIN_VERSION"
          test "$(cat release/source-commit.txt)" = "$GITHUB_SHA"
          test -s "release/Honggo-${PLUGIN_VERSION}.dylib"
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Publish downloadable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${PLUGIN_VERSION}-test.${GITHUB_RUN_NUMBER}"
          printf '%s\n' \
            "Honggo ${PLUGIN_VERSION} testing build from GitHub Actions #${GITHUB_RUN_NUMBER}." \
            "Source commit: ${GITHUB_SHA}" \
            "macOS/iPhoneOS build, settings and tab-bar regression checks passed." \
            "Not a device-accepted stable release. Inject only one dylib into the supported host app." \
            "Assets include the dylib, SHA256SUMS.txt, VERSION and source-commit.txt." \
            > release-notes.md
          gh release create "$tag" \
            "release/Honggo-${PLUGIN_VERSION}.dylib" \
            "release/SHA256SUMS.txt" "release/VERSION" "release/source-commit.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Honggo ${PLUGIN_VERSION} (test #${GITHUB_RUN_NUMBER})" \
            --prerelease --notes-file release-notes.md
