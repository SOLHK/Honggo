name: Build iOS plugin

on:
  push:
    branches: [test]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  HG_SIMULATOR_OS: "27.2"

jobs:
  tabbar:
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require Xcode 27.2 and iOS 27.2 runtime
        run: bash tools/verify-ios-toolchain.sh
      - name: Verify plugin version
        id: version
        env:
          VERSION_BASE: ${{ github.event.before }}
        run: |
          version=$(python3 tools/version.py --check --base "$VERSION_BASE" --channel test)
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check IPA preparation and version rules
        run: python3 -B -m unittest discover -s tests -v
      - name: Check glass tab bar in UIKit with a simulated host
        run: bash tools/test-tabbar-ios.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: Honggo-tabbar-simulator-evidence
          path: |
            build/tabbar-tests/**/*-results.json
            build/tabbar-tests/**/*-simulator.png
            build/tabbar-tests/**/simulator.log
            build/tabbar-tests/simulator-target.json
            build/toolchain/BUILD-ENVIRONMENT.json
          if-no-files-found: warn

  settings:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Xcode 27.2 and iOS 27.2 runtime
        run: bash tools/verify-ios-toolchain.sh
      - name: Check settings in UIKit with a simulated host
        run: bash tools/test-settings-ios.sh
      - name: Check bounded diagnostics on real Foundation
        if: ${{ !cancelled() }}
        run: bash tools/test-diagnostics.sh
      - name: Check scoped preference backup and restore
        if: ${{ !cancelled() }}
        run: bash tools/test-preferences.sh
      - name: Check independent runtime modules and safe hook retries
        if: ${{ !cancelled() }}
        run: bash tools/test-runtime-ios.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: Honggo-settings-simulator-evidence
          path: |
            build/toolchain/BUILD-ENVIRONMENT.json
            build/settings-tests/simulator-target.json
            build/settings-tests/settings-results.json
            build/settings-tests/simulator.log
            build/settings-tests/*-simulator.png
            build/diagnostics-tests/*.log
            build/preferences-tests/*.log
            build/runtime-tests/*.json
            build/runtime-tests/*.log
          if-no-files-found: warn

  adscene:
    name: Check screenshot diagnostics in UIKit
    runs-on: xcode-27
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Xcode 27.2 and iOS 27.2 runtime
        run: bash tools/verify-ios-toolchain.sh
      - name: Check player and popup scene capture without UI mutation
        run: bash tools/test-ad-scene-ios.sh
      - name: Check ad filtering and disabled behavior
        run: bash tools/test-ads-ios.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: Honggo-adscene-simulator-evidence
          path: |
            build/toolchain/BUILD-ENVIRONMENT.json
            build/ad-scene-tests/*.json
            build/ad-scene-tests/*.log
            build/ads-tests/*.json
            build/ads-tests/*.log
          if-no-files-found: warn

  appearance:
    runs-on: xcode-27
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require Xcode 27.2 and iOS 27.2 runtime
        run: bash tools/verify-ios-toolchain.sh
      - name: Validate appearance preference boundaries
        run: bash tools/test-appearance-preferences.sh
      - name: Validate visual adapters and restoration in UIKit
        run: bash tools/test-appearance-ios.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: Honggo-appearance-simulator-evidence
          path: |
            build/toolchain/BUILD-ENVIRONMENT.json
            build/appearance-tests/*.json
            build/appearance-tests/*.log
          if-no-files-found: warn

  iphoneos:
    needs: [tabbar, settings, adscene, appearance]
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Xcode 27.2 and iOS 27.2 runtime
        run: bash tools/verify-ios-toolchain.sh
      - name: Build and inspect device dylib
        env:
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          bash tools/build-ios.sh
          git rev-parse HEAD > build/source-commit.txt
          cp build/toolchain/BUILD-ENVIRONMENT.json build/BUILD-ENVIRONMENT.json
          printf '%s\n' "$PLUGIN_VERSION" > build/VERSION
          (cd build && shasum -a 256 "Honggo-$PLUGIN_VERSION.dylib" BUILD-ENVIRONMENT.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Honggo-${{ needs.tabbar.outputs.version }}
          path: |
            build/Honggo-${{ needs.tabbar.outputs.version }}.dylib
            build/VERSION
            build/source-commit.txt
            build/SHA256SUMS.txt
            build/BUILD-ENVIRONMENT.json
          if-no-files-found: error

  publish_test:
    name: Publish verified test dylib
    if: github.ref == 'refs/heads/test'
    needs: [tabbar, settings, adscene, appearance, iphoneos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download dylib built by this successful run
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "Honggo-${PLUGIN_VERSION}" --dir release
      - name: Verify downloaded artifact identity and checksum
        env:
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          set -euo pipefail
          test "$(cat release/VERSION)" = "$PLUGIN_VERSION"
          test "$(cat release/source-commit.txt)" = "$GITHUB_SHA"
          test -s "release/Honggo-${PLUGIN_VERSION}.dylib"
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Publish downloadable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.tabbar.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$PLUGIN_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-R[1-9][0-9]*$ ]]
          tag="v${PLUGIN_VERSION}"
          released_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
            --jq ".[] | select(.ref == \"refs/tags/${tag}\") | .object.sha")
          if [ -n "$released_commit" ] && [ "$released_commit" != "$GITHUB_SHA" ]; then
            printf 'Tag %s already belongs to a different commit; increase the R number.\n' "$tag" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$released_commit" = "$GITHUB_SHA"
            printf 'Release %s already exists for this commit; preserving its assets.\n' "$tag"
            exit 0
          fi
          if [ -z "$released_commit" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}" > /dev/null
          fi
          printf '%s\n' \
            "Honggo ${PLUGIN_VERSION} testing build from GitHub Actions #${GITHUB_RUN_NUMBER}." \
            "Source commit: ${GITHUB_SHA}" \
            "Built with Xcode 27.2 / iPhoneOS SDK 27.2. Required UIKit regression suites ran on the pinned iOS 27.2 simulator, not a fallback runtime." \
            "R8 restores the original patch presentation method and host-owned callback timing instead of synthesizing ready(nil). Existing advertisement eligibility gates remain enabled." \
            "Adds opt-in, privacy-safe lifecycle traces for clean mode, model updates, playback-state notifications and finish interception." \
            "Candidate for the portrait clean-mode / long-press 2x / auto-next freeze report; the old log does not establish its root cause. Actual playback and patch-ad coverage require device verification." \
            "Retains independent appearance customization and the TG update channel https://t.me/Naloiafeed." \
            "Reference behavior was studied; implementation is written for Honggo without importing NaiwaGuo source or assets." \
            "Actual Hongguo iPhone appearance, playback and ad disappearance remain unverified." \
            "R-numbered builds are tests; the suffix is removed only for a stable release on main." \
            "Not a device-accepted stable release. Inject only one dylib into the supported host app." \
            "Assets include the dylib, SHA256SUMS.txt, VERSION and source-commit.txt." \
            > release-notes.md
          gh release create "$tag" \
            "release/Honggo-${PLUGIN_VERSION}.dylib" \
            "release/SHA256SUMS.txt" "release/VERSION" "release/source-commit.txt" "release/BUILD-ENVIRONMENT.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --verify-tag \
            --title "Honggo ${PLUGIN_VERSION} beta · iOS 27.2" \
            --prerelease --notes-file release-notes.md
