name: Integrate 27.2 validation semantics
on:
  push:
    branches: [work/r7-ios27-validation]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed verification-only changes
        run: |
          set -euo pipefail
          echo 'c72f563fe07523095735aa2ed96b8ed16d5efc21b0bd3ea0437b2e1930df00a0  .github/r7-validation.patch' | sha256sum -c -
          git apply --check .github/r7-validation.patch
          git apply --index .github/r7-validation.patch
          git rm .github/r7-validation.patch
          python3 -B -m unittest discover -s tests -v
          for script in tools/*.sh; do bash -n "$script"; done
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Respect Xcode 27 design contract and validate cold ShareSheet presentation without dropping assertions'
          git push origin HEAD:refs/heads/work/r7-ios27-validation
          git rev-parse HEAD
