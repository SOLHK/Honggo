name: Appearance development
on:
  push:
    branches: [work/appearance-r5]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Snapshot tracked source for reproducible local review
        run: |
          mkdir -p snapshot
          git archive --format=tar HEAD > snapshot/Honggo-source.tar
          git rev-parse HEAD > snapshot/source-commit.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: Honggo-appearance-source
          path: snapshot/
          retention-days: 7
