name: Appearance development
on:
  push:
    branches: [work/appearance-r5]
permissions:
  contents: read
jobs:
  integrate_reviewed_corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - id: source
        name: Apply checksum-verified source correction once
        run: |
          set -euo pipefail
          if test -f .github/r5-corrections.patch; then
            echo '16eab1c60ee7f5221aa81f9e48290a0d932897fc7dc1878168ca2c8d460cce5e  .github/r5-corrections.patch' | sha256sum -c -
            git apply --check .github/r5-corrections.patch
            git apply --index .github/r5-corrections.patch
            git rm .github/r5-corrections.patch
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Cover concrete comment surfaces and preserve appearance parameters on disable'
            git push origin HEAD:refs/heads/work/appearance-r5
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: integrate_reviewed_corrections
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.integrate_reviewed_corrections.outputs.source }}
          persist-credentials: false
      - name: Compile device plugin
        run: bash tools/build-ios.sh
      - name: Validate appearance preferences
        if: ${{ !cancelled() }}
        run: bash tools/test-appearance-preferences.sh
      - name: Validate appearance behavior in UIKit
        if: ${{ !cancelled() }}
        run: bash tools/test-appearance-ios.sh
      - name: Snapshot tested source
        if: always()
        run: |
          mkdir -p build/appearance-tests
          git archive --format=tar HEAD > build/appearance-tests/source.tar
          git rev-parse HEAD > build/appearance-tests/source-commit.txt
      - name: Archive development evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: Honggo-appearance-development
          path: |
            build/appearance-tests/*.json
            build/appearance-tests/*.log
            build/appearance-tests/*.tar
            build/appearance-tests/*.txt
            build/*.dylib
          if-no-files-found: warn
