name: Appearance development
on:
  push:
    branches: [work/appearance-r5]
permissions:
  contents: read
jobs:
  integrate_reviewed_corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified transition fix once
        run: |
          set -euo pipefail
          if test -f .github/r6-transition.patch; then
            echo '7247a0399960cd3464bcdac09b87e1717373d73061610deef96674d3a4bad7cf  .github/r6-transition.patch' | sha256sum -c -
            git apply --check .github/r6-transition.patch
            git apply --index .github/r6-transition.patch
            git rm .github/r6-transition.patch
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Serialize search transitions and prepare Honggo R6 visual candidate'
            git push origin HEAD:refs/heads/work/appearance-r5
          fi
          git rev-parse HEAD
